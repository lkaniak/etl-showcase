[project]
name = "etl"
version = "0.1.0"
description = "Generic async ETL framework"
requires-python = ">=3.13.0,<3.14.0"
license = "MIT"
dependencies = [
    "loguru>=0.7.0",
    "pydantic>=2.10.2",
    "pydantic-settings>=2.6.1",
    "python-dateutil>=2.8.2",
    "sqlalchemy>=2.0.38",
    "pandas>=2.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_core"]
