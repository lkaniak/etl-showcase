[project]
name = "external-api-example"
version = "0.1.0"
requires-python = ">=3.13.0,<3.14.0"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_source_api"]
