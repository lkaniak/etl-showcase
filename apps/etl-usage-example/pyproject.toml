[project]
name = "etl-usage-example"
version = "0.1.0"
description = "Marketplace ETL implementation"
requires-python = ">=3.13.0,<3.14.0"
license = "MIT"
dependencies = [
    "etl",
    "loguru>=0.7.0",
    "pydantic>=2.10.2",
    "pydantic-settings>=2.6.1",
    "pymongo>=4.10.1",
    "sqlalchemy>=2.0.38",
    "pandas>=2.2.3",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "aiomysql>=0.2.0",
    "cryptography>=43.0.0",
]

[project.scripts]
marketplace-etl = "my_marketplace_etl.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_marketplace_etl"]

[tool.uv.sources]
etl = { workspace = true }
