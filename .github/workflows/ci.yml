name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run tests
        run: uv run pytest

      - name: Check import boundaries
        run: uv run lint-imports

  compose-smoke:
    name: Docker Compose e2e smoke test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Run full stack end-to-end
        run: docker compose up --build --abort-on-container-exit --exit-code-from etl

      - name: Tear down
        if: always()
        run: docker compose down -v
